<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13131e"><title>Asas do Último Ninho</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="bar"><a class="brand" href="#jogar" aria-label="Último Ninho, início"><canvas data-icon="dragon" width="20" height="20"></canvas><span>ÚLTIMO NINHO</span></a><nav aria-label="Navegação"><button data-page="jogar" class="active">Jogar</button><button data-page="ninho">Ninho</button><button data-page="mapa">Mapa</button></nav><button id="sound" class="sound" aria-pressed="false"><span id="soundIcon"></span><span id="soundLabel">Som desligado</span></button></div></header>
<main><section id="jogar"><div class="console"><div class="rim"><span class="rim-label"><i></i> CAMPANHA 3D</span><span class="rim-right"><span class="signal">▂▄▆</span> <span id="ready">PRONTO PARA VOAR</span></span></div>
<div class="screen" id="screen"><div id="cover"><div class="hero-copy"><div class="hero-kicker"><span></span> OS SEIS REINOS</div><h1>Asas do<br><em>Último Ninho</em></h1><p>Enfrente o Eclipse, liberte os filhotes e reconstrua o Grande Ninho.</p><button class="gold" id="launch"><b aria-hidden="true">▸</b> <span>Iniciar aventura</span></button></div></div>
<div id="game" role="img" aria-label="Campo de voo tridimensional" tabindex="-1" hidden></div><div id="hud" hidden><div id="hudPhase" class="hud-phase"></div><div id="meters"></div><button id="pause" title="Pausar" aria-label="Pausar">Ⅱ</button></div><div id="bossSignal" class="boss-signal" hidden aria-hidden="true"></div><div id="flightInfo" hidden><div id="flightTip"></div><div class="route"><span id="routeName">Percurso</span><progress id="routeProgress" max="100" value="0"></progress></div></div><div id="overlay" hidden></div></div>
<div class="console-foot"><span><b class="cross">✦</b><span id="stageLabel"></span></span><div><button id="help" title="Controles" aria-label="Ver controles"></button><button id="expand" title="Tela cheia" aria-label="Tela cheia"></button></div></div>
<div id="touch" hidden><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div><button data-key="Space">Fogo</button><button data-key="ShiftLeft">Esquiva</button><button data-key="KeyF">Fúria</button><button data-key="KeyE">Poder</button></div></div></div>
<div class="section-title"><h2>Diário de jornada</h2><span class="smallcap"><i class="green"></i> <span id="storageState">SALVAMENTO LOCAL</span></span></div><div class="cards" id="journal"></div></section>
<section id="area" hidden><div class="section-title"><h1 id="areaTitle"></h1><button class="ghost" data-page="jogar">← Voltar ao jogo</button></div><div id="areaContent"></div></section>
<footer><span>ASAS DO ÚLTIMO NINHO</span><button id="devlog">CHECKPOINT DO PROJETO · V0.3 ↗</button></footer></main>
<dialog id="dialog"><div id="dialogContent"></div><button class="ghost" id="closeDialog">Fechar</button></dialog><div id="toast" role="status"></div>
<script src="catalog.js"></script><script src="save.js"></script><script src="art.js"></script><script src="vendor/flight-view.js"></script><script src="flight.js"></script><script src="app.js"></script></body></html>
